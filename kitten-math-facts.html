<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitten Math Facts</title>
<style>
  :root {
    --pink: #ff9ec4;
    --pink-deep: #ff6fa5;
    --green: #4cd964;
    --green-deep: #2fb84a;
    --sky: #cdeeff;
    --sky2: #eafaff;
    --ink: #3a3a55;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Baloo", system-ui, sans-serif;
    background: linear-gradient(160deg, var(--sky2), var(--sky));
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
    padding: 18px 14px 40px;
  }
  h1 {
    margin: 6px 0 2px;
    font-size: clamp(28px, 6vw, 46px);
    color: var(--pink-deep);
    text-shadow: 2px 2px 0 #fff;
    letter-spacing: 1px;
  }
  .subtitle { margin: 0 0 14px; font-size: 15px; opacity: 0.7; }

  /* Mode selector */
  .modes {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
  }
  .mode-btn {
    border: 3px solid var(--pink);
    background: #fff;
    color: var(--pink-deep);
    font: inherit;
    font-size: 18px;
    font-weight: bold;
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .1s, background .15s, color .15s;
  }
  .mode-btn:hover { transform: translateY(-2px); }
  .mode-btn.active {
    background: var(--pink);
    color: #fff;
    box-shadow: 0 4px 0 var(--pink-deep);
  }

  /* Card */
  .card {
    background: #fff;
    border-radius: 28px;
    padding: 28px 26px 30px;
    box-shadow: 0 12px 30px rgba(140,120,160,0.25);
    width: min(440px, 100%);
    text-align: center;
    position: relative;
  }

  .kitten-stage {
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 6px;
  }
  .kitten-stage svg { width: 170px; height: 170px; }
  .pop { animation: pop .5s ease; }
  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  .wiggle { animation: wiggle 1.4s ease-in-out infinite; }
  @keyframes wiggle {
    0%,100% { transform: rotate(-4deg); }
    50% { transform: rotate(4deg); }
  }

  .problem {
    font-size: clamp(40px, 12vw, 66px);
    font-weight: bold;
    color: var(--ink);
    margin: 6px 0 18px;
    line-height: 1.05;
  }
  .problem.vertical {
    display: inline-block;
    text-align: right;
    border-bottom: 5px solid var(--ink);
    padding: 0 14px 6px;
    min-width: 130px;
  }
  .problem.vertical .op-row { display: block; }
  .problem.vertical .op { margin-right: 18px; }

  .answer-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: stretch;
  }
  #answer {
    font: inherit;
    font-size: 38px;
    font-weight: bold;
    text-align: center;
    width: 130px;
    padding: 6px 8px;
    border: 4px solid var(--sky);
    border-radius: 16px;
    color: var(--ink);
    outline: none;
  }
  #answer:focus { border-color: var(--pink); }
  #answer.shake { animation: shake .4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .enter-btn {
    border: none;
    background: var(--green);
    color: #fff;
    font: inherit;
    font-size: 20px;
    font-weight: bold;
    padding: 0 22px;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--green-deep);
    transition: transform .08s;
  }
  .enter-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--green-deep); }

  .message {
    min-height: 28px;
    margin-top: 16px;
    font-size: 22px;
    font-weight: bold;
  }
  .message.correct { color: var(--green-deep); }
  .message.wrong { color: var(--pink-deep); }

  .hint { margin-top: 4px; font-size: 14px; opacity: 0.6; min-height: 18px; }

  .mute-row { margin-top: 16px; font-size: 14px; opacity: 0.7; }
  .mute-row button {
    font: inherit; font-size: 14px; background: none; border: none;
    cursor: pointer; color: var(--ink); text-decoration: underline;
  }
</style>
</head>
<body>
  <h1>🐱 Kitten Math Facts</h1>
  <p class="subtitle">Pick a mode and start solving!</p>

  <div class="modes" id="modes">
    <button class="mode-btn active" data-mode="add">➕ Addition</button>
    <button class="mode-btn" data-mode="sub">➖ Subtraction</button>
    <button class="mode-btn" data-mode="mix">🔀 Mix</button>
  </div>

  <div class="card">
    <div class="kitten-stage" id="kittenStage"></div>

    <div class="problem" id="problem"></div>

    <div class="answer-row">
      <input id="answer" type="text" inputmode="numeric" autocomplete="off" aria-label="Your answer">
      <button class="enter-btn" id="enterBtn" title="Submit answer">✓ Enter</button>
    </div>

    <div class="message" id="message"></div>
    <div class="hint" id="hint"></div>

    <div class="mute-row">
      <button id="muteBtn">🔊 Sound on</button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ---------- State ----------
  var mode = "add";           // add | sub | mix
  var current = null;         // { a, b, op, answer, vertical }
  var soundOn = true;

  var problemEl = document.getElementById("problem");
  var answerEl  = document.getElementById("answer");
  var messageEl = document.getElementById("message");
  var hintEl    = document.getElementById("hint");
  var stageEl   = document.getElementById("kittenStage");
  var enterBtn  = document.getElementById("enterBtn");
  var muteBtn   = document.getElementById("muteBtn");

  // ---------- Sound (Web Audio, no files) ----------
  var audioCtx = null;
  function ctx() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    return audioCtx;
  }
  function tone(freq, start, dur, type, vol) {
    var c = ctx();
    if (!c) return;
    var osc = c.createOscillator();
    var gain = c.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    var t0 = c.currentTime + start;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }
  function chimeCorrect() {
    if (!soundOn) return;
    tone(523.25, 0.00, 0.18, "sine", 0.25); // C5
    tone(659.25, 0.10, 0.18, "sine", 0.25); // E5
    tone(783.99, 0.20, 0.28, "sine", 0.25); // G5
    tone(1046.5, 0.32, 0.30, "sine", 0.22); // C6
  }
  function buzzWrong() {
    if (!soundOn) return;
    tone(196.00, 0.00, 0.22, "square", 0.18); // G3
    tone(155.56, 0.16, 0.30, "square", 0.18); // Eb3
  }

  // ---------- Kitten SVGs ----------
  function kittenHappy() {
    return '' +
    '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="pop wiggle">' +
      '<ellipse cx="100" cy="182" rx="55" ry="10" fill="#000" opacity="0.08"/>' +
      // ears
      '<path d="M52 60 L44 20 L82 46 Z" fill="#ffb56b"/>' +
      '<path d="M148 60 L156 20 L118 46 Z" fill="#ffb56b"/>' +
      '<path d="M56 54 L52 34 L74 48 Z" fill="#ff9ec4"/>' +
      '<path d="M144 54 L148 34 L126 48 Z" fill="#ff9ec4"/>' +
      // head
      '<circle cx="100" cy="105" r="62" fill="#ffc98f"/>' +
      // stripes
      '<path d="M100 46 q6 14 0 26" stroke="#f0a24d" stroke-width="6" fill="none" stroke-linecap="round"/>' +
      '<path d="M78 50 q4 12 0 22" stroke="#f0a24d" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      '<path d="M122 50 q-4 12 0 22" stroke="#f0a24d" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      // happy eyes (closed arcs)
      '<path d="M66 98 q12 -16 24 0" stroke="#4a3020" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      '<path d="M110 98 q12 -16 24 0" stroke="#4a3020" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      // blush
      '<circle cx="64" cy="120" r="10" fill="#ff9ec4" opacity="0.55"/>' +
      '<circle cx="136" cy="120" r="10" fill="#ff9ec4" opacity="0.55"/>' +
      // nose + smile
      '<path d="M94 116 L106 116 L100 123 Z" fill="#ff6fa5"/>' +
      '<path d="M100 123 q-14 18 -28 6" stroke="#4a3020" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '<path d="M100 123 q14 18 28 6" stroke="#4a3020" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      // whiskers
      '<path d="M40 112 L70 116 M40 126 L70 124" stroke="#c98a4a" stroke-width="3" stroke-linecap="round"/>' +
      '<path d="M160 112 L130 116 M160 126 L130 124" stroke="#c98a4a" stroke-width="3" stroke-linecap="round"/>' +
      // little paws up
      '<circle cx="52" cy="168" r="14" fill="#ffc98f"/>' +
      '<circle cx="148" cy="168" r="14" fill="#ffc98f"/>' +
    '</svg>';
  }

  function kittenSad() {
    return '' +
    '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="pop">' +
      '<ellipse cx="100" cy="182" rx="55" ry="10" fill="#000" opacity="0.08"/>' +
      // ears (droopier)
      '<path d="M52 64 L40 26 L82 50 Z" fill="#ffb56b"/>' +
      '<path d="M148 64 L160 26 L118 50 Z" fill="#ffb56b"/>' +
      '<path d="M56 58 L50 40 L74 52 Z" fill="#ff9ec4"/>' +
      '<path d="M144 58 L150 40 L126 52 Z" fill="#ff9ec4"/>' +
      // head
      '<circle cx="100" cy="105" r="62" fill="#ffc98f"/>' +
      // stripes
      '<path d="M100 46 q6 14 0 26" stroke="#f0a24d" stroke-width="6" fill="none" stroke-linecap="round"/>' +
      '<path d="M78 50 q4 12 0 22" stroke="#f0a24d" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      '<path d="M122 50 q-4 12 0 22" stroke="#f0a24d" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      // sad eyes
      '<circle cx="78" cy="104" r="8" fill="#4a3020"/>' +
      '<circle cx="122" cy="104" r="8" fill="#4a3020"/>' +
      '<circle cx="80" cy="101" r="2.5" fill="#fff"/>' +
      '<circle cx="124" cy="101" r="2.5" fill="#fff"/>' +
      // sad brows
      '<path d="M66 92 q12 -6 22 -2" stroke="#4a3020" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '<path d="M134 92 q-12 -6 -22 -2" stroke="#4a3020" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      // tears
      '<path d="M78 114 q-5 16 0 24 q5 -8 0 -24" fill="#6ec6ff"><animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/></path>' +
      '<path d="M122 114 q-5 16 0 24 q5 -8 0 -24" fill="#6ec6ff"><animate attributeName="opacity" values="0.4;1;0.4" dur="1s" repeatCount="indefinite"/></path>' +
      // nose + frown
      '<path d="M94 118 L106 118 L100 125 Z" fill="#ff6fa5"/>' +
      '<path d="M84 142 q16 -14 32 0" stroke="#4a3020" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      // whiskers
      '<path d="M40 116 L70 118 M40 128 L70 126" stroke="#c98a4a" stroke-width="3" stroke-linecap="round"/>' +
      '<path d="M160 116 L130 118 M160 128 L130 126" stroke="#c98a4a" stroke-width="3" stroke-linecap="round"/>' +
    '</svg>';
  }

  function kittenIdle() {
    return '' +
    '<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">' +
      '<ellipse cx="100" cy="182" rx="55" ry="10" fill="#000" opacity="0.08"/>' +
      '<path d="M52 60 L44 20 L82 46 Z" fill="#ffb56b"/>' +
      '<path d="M148 60 L156 20 L118 46 Z" fill="#ffb56b"/>' +
      '<path d="M56 54 L52 34 L74 48 Z" fill="#ff9ec4"/>' +
      '<path d="M144 54 L148 34 L126 48 Z" fill="#ff9ec4"/>' +
      '<circle cx="100" cy="105" r="62" fill="#ffc98f"/>' +
      '<path d="M100 46 q6 14 0 26" stroke="#f0a24d" stroke-width="6" fill="none" stroke-linecap="round"/>' +
      '<path d="M78 50 q4 12 0 22" stroke="#f0a24d" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      '<path d="M122 50 q-4 12 0 22" stroke="#f0a24d" stroke-width="5" fill="none" stroke-linecap="round"/>' +
      '<circle cx="78" cy="104" r="8" fill="#4a3020"/>' +
      '<circle cx="122" cy="104" r="8" fill="#4a3020"/>' +
      '<circle cx="80" cy="101" r="2.5" fill="#fff"/>' +
      '<circle cx="124" cy="101" r="2.5" fill="#fff"/>' +
      '<circle cx="64" cy="120" r="10" fill="#ff9ec4" opacity="0.45"/>' +
      '<circle cx="136" cy="120" r="10" fill="#ff9ec4" opacity="0.45"/>' +
      '<path d="M94 116 L106 116 L100 123 Z" fill="#ff6fa5"/>' +
      '<path d="M100 123 q-10 10 -20 4" stroke="#4a3020" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '<path d="M100 123 q10 10 20 4" stroke="#4a3020" stroke-width="4" fill="none" stroke-linecap="round"/>' +
      '<path d="M40 112 L70 116 M40 126 L70 124" stroke="#c98a4a" stroke-width="3" stroke-linecap="round"/>' +
      '<path d="M160 112 L130 116 M160 126 L130 124" stroke="#c98a4a" stroke-width="3" stroke-linecap="round"/>' +
    '</svg>';
  }

  function showKitten(kind) {
    if (kind === "happy") stageEl.innerHTML = kittenHappy();
    else if (kind === "sad") stageEl.innerHTML = kittenSad();
    else stageEl.innerHTML = kittenIdle();
  }

  // ---------- Problem generation ----------
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

  function makeProblem() {
    var op = mode;
    if (mode === "mix") op = Math.random() < 0.5 ? "add" : "sub";

    var a, b, answer;
    if (op === "add") {
      // answer under 20  -> a + b <= 19
      answer = randInt(0, 19);
      a = randInt(0, answer);
      b = answer - a;
    } else {
      // subtraction, non-negative answer, operands under 20
      a = randInt(0, 19);
      b = randInt(0, a);
      answer = a - b;
    }
    return {
      a: a,
      b: b,
      op: op,
      answer: answer,
      vertical: Math.random() < 0.5
    };
  }

  function renderProblem() {
    var p = current;
    var sign = p.op === "add" ? "+" : "−";
    problemEl.className = "problem" + (p.vertical ? " vertical" : "");
    if (p.vertical) {
      problemEl.innerHTML =
        '<span class="op-row">' + p.a + '</span>' +
        '<span class="op-row"><span class="op">' + sign + '</span>' + p.b + '</span>';
    } else {
      problemEl.textContent = p.a + " " + sign + " " + p.b + " = ?";
    }
  }

  function newProblem() {
    current = makeProblem();
    renderProblem();
    answerEl.value = "";
    answerEl.disabled = false;
    messageEl.textContent = "";
    messageEl.className = "message";
    hintEl.textContent = "";
    showKitten("idle");
    answerEl.focus();
  }

  // ---------- Answer checking ----------
  function submit() {
    if (ctx() && ctx().state === "suspended") ctx().resume();
    var raw = answerEl.value.trim();
    if (raw === "" || isNaN(Number(raw))) {
      answerEl.classList.add("shake");
      setTimeout(function () { answerEl.classList.remove("shake"); }, 400);
      answerEl.focus();
      return;
    }
    var val = parseInt(raw, 10);

    if (val === current.answer) {
      showKitten("happy");
      chimeCorrect();
      messageEl.textContent = "Purrfect! That's right! 🎉";
      messageEl.className = "message correct";
      hintEl.textContent = "Here comes a new one...";
      answerEl.disabled = true;
      setTimeout(newProblem, 1400);
    } else {
      showKitten("sad");
      buzzWrong();
      messageEl.textContent = "Oops! Try again 💧";
      messageEl.className = "message wrong";
      hintEl.textContent = "Type the correct answer to continue.";
      answerEl.classList.add("shake");
      setTimeout(function () { answerEl.classList.remove("shake"); }, 400);
      answerEl.value = "";
      answerEl.focus();
    }
  }

  // ---------- Events ----------
  enterBtn.addEventListener("click", submit);
  answerEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); submit(); }
  });

  document.getElementById("modes").addEventListener("click", function (e) {
    var btn = e.target.closest(".mode-btn");
    if (!btn) return;
    mode = btn.getAttribute("data-mode");
    var all = document.querySelectorAll(".mode-btn");
    for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
    btn.classList.add("active");
    newProblem();
  });

  muteBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    muteBtn.textContent = soundOn ? "🔊 Sound on" : "🔇 Sound off";
    if (soundOn && ctx() && ctx().state === "suspended") ctx().resume();
  });

  // ---------- Start ----------
  newProblem();
})();
</script>
</body>
</html>
